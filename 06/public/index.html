<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Radar · S06</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">S06 · CLAUDE CALL PATH</p>
      <h1>리뷰 속 불만을<br><em>다섯 줄로.</em></h1>
      <p class="lead">고객 리뷰 10개 이상을 붙여넣으면, 서버에서 Claude가 긍정 요인과 페인 포인트를 정리합니다.</p>
    </header>

    <section class="workspace" aria-labelledby="input-title">
      <form id="review-form">
        <div class="section-head">
          <div><p class="eyebrow">RAW REVIEWS</p><h2 id="input-title">고객 리뷰</h2></div>
          <strong id="review-count" aria-live="polite"></strong>
        </div>
        <label for="reviews">리뷰 한 줄에 하나씩 입력</label>
        <textarea id="reviews" required placeholder="배송은 빠르고 가격도 좋아요.\n설치 방법을 찾기 어려웠습니다.\n…"></textarea>
        <button id="analyze-button" type="submit">ANALYZE REVIEWS</button>
        <p id="status" role="status" aria-live="polite">API 키는 브라우저가 아닌 서버 환경변수에만 저장됩니다.</p>
      </form>

      <section id="result" aria-label="리뷰 분석 결과" hidden></section>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
