<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Review Radar · S06</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">S06 · CLAUDE CALL PATH</p>
      <h1>리뷰 속 불만을<br><em>다섯 줄로.</em></h1>
      <p class="lead">Amazon PDP URL을 넣으면, 페이지에 즉시 보이는 상위 리뷰를 서버에서 읽어 Claude가 긍정 요인과 페인 포인트로 정리합니다.</p>
    </header>

    <section class="workspace" aria-labelledby="input-title">
      <form id="review-form">
        <div class="section-head">
          <div><p class="eyebrow">AMAZON PDP</p><h2 id="input-title">상품 URL</h2></div>
        </div>
        <label for="amazon-url">Amazon 상품 상세 URL</label>
        <input id="amazon-url" type="url" required placeholder="https://www.amazon.com/dp/...">
        <button id="analyze-button" type="submit">ANALYZE REVIEWS</button>
        <p id="status" role="status" aria-live="polite">PDP에 즉시 보이는 상위 1~5개 리뷰만 읽습니다. API 키는 서버 환경변수에만 저장됩니다.</p>
      </form>

      <section id="result" aria-label="리뷰 분석 결과" hidden></section>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
